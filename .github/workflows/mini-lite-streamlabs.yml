name: MINI Lite Discord Forum Build 2.0.2

on:
  push:
    branches: [ "feature/mini-lite-discord-forum-v2.0.2" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-lite:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore Lite only
        run: dotnet restore TiHiY.StreamControlMini.Lite.csproj
      - name: Release build Lite only
        run: dotnet build TiHiY.StreamControlMini.Lite.csproj -c Release --no-restore
      - name: Publish self-contained win-x64
        run: dotnet publish TiHiY.StreamControlMini.Lite.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish-lite
      - name: Smoke launch + screenshot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force preview | Out-Null
          $exe = (Resolve-Path "publish-lite/TiHiY.StreamControlMini.Lite.exe").Path
          $shot = Join-Path $PWD "preview/TiHiY-StreamControl-MINI-Lite.png"
          $p = Start-Process -FilePath $exe -ArgumentList "--ci-screenshot=$shot" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Lite exited with $($p.ExitCode)" }
          if (-not (Test-Path $shot)) { throw "Lite screenshot missing" }
      - name: Visual audit screenshots
        shell: pwsh
        run: |
          $exe = (Resolve-Path "publish-lite/TiHiY.StreamControlMini.Lite.exe").Path
          $folder = Join-Path $PWD "preview/ui-audit"
          New-Item -ItemType Directory -Force $folder | Out-Null
          $p = Start-Process -FilePath $exe -ArgumentList "--ci-ui-audit=$folder" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "UI audit exited with $($p.ExitCode)" }
          foreach ($file in @('chat-bot.png','discord-servers.png','settings.png','game-overlay-settings.png','game-overlay.png')) {
            if (-not (Test-Path (Join-Path $folder $file))) { throw "UI audit screenshot missing: $file" }
          }
      - name: Restored modules smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path "publish-lite/TiHiY.StreamControlMini.Lite.exe").Path
          $p = Start-Process -FilePath $exe -ArgumentList "--ci-modules" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Restored modules smoke test exited with $($p.ExitCode)" }
          Write-Host "Discord, Discord profiles, Chat Bot and game overlay modules instantiated successfully."
      - name: Idle memory benchmark with overlay
        shell: pwsh
        run: |
          $exe = (Resolve-Path "publish-lite/TiHiY.StreamControlMini.Lite.exe").Path
          $p = Start-Process -FilePath $exe -ArgumentList "--ci-overlay-benchmark" -PassThru
          Start-Sleep -Seconds 5
          $proc = Get-Process -Id $p.Id
          $ws = [math]::Round($proc.WorkingSet64 / 1MB, 1)
          $private = [math]::Round($proc.PrivateMemorySize64 / 1MB, 1)
          $cpu = [math]::Round($proc.CPU, 3)
          "Scenario=Main+ChatBot+GameOverlay+AimpOverlay`nWorkingSetMB=$ws`nPrivateMB=$private`nCpuSecondsAfter5s=$cpu" | Set-Content preview/perf.txt
          Write-Host "LITE + OVERLAY + AIMP: WorkingSet=$ws MB Private=$private MB CPU(5s)=$cpu s"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - name: Runtime composition report
        shell: pwsh
        run: |
          $size = [math]::Round(((Get-ChildItem publish-lite -Recurse -File | Measure-Object Length -Sum).Sum / 1MB),1)
          "PublishSizeMB=$size" | Add-Content preview/perf.txt
          Write-Host "Publish size: $size MB"
          Get-ChildItem publish-lite -Recurse -File | Select-Object Name,Length | Sort-Object Length -Descending | Select-Object -First 15 | Format-Table -AutoSize
          $names = (Get-ChildItem publish-lite -Recurse -File).Name -join "`n"
          foreach ($bad in @('SocketIOClient','ObsWebSocket','Aida64','StalkerExact')) { if ($names -match $bad) { throw "Forbidden legacy dependency leaked into Lite publish: $bad" } }
      - name: Upload Lite preview
        uses: actions/upload-artifact@v4
        with:
          name: TiHiY-StreamControl-MINI-Lite-2.0.2-preview
          path: preview/**
      - name: Upload Lite Windows x64
        uses: actions/upload-artifact@v4
        with:
          name: TiHiY-StreamControl-MINI-LITE-DISCORD-FORUM-v2.0.2-win-x64
          path: publish-lite/**
